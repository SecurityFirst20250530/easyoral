<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频节点标注播放器</title>

    <!-- ============================================== -->

    <style>
        /* ==================== 全局重置与变量 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2333;
            --bg-hover: #2d3548;
            --accent: #e94560;
            --accent-hover: #ff5470;
            --node-color: #e94560;
            --node-active: #2dd4bf;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --border: #30363d;
            --progress-bg: #21262d;
            --progress-fill: linear-gradient(90deg, #e94560, #ff8c42);
            --radius: 12px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            --transition: all 0.25s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ==================== 整体布局 ==================== */
        .app-container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ad-sidebar {
            width: 300px;
            flex-shrink: 0;
        }

        /* ==================== 页面头部 ==================== */
        .app-header {
            text-align: center;
            padding: 20px 0;
        }

        .app-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #ff8c42, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* ==================== 卡片通用样式 ==================== */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* ==================== 文件选择区 ==================== */
        .file-section {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .file-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            user-select: none;
        }

        .file-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .sample-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .sample-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filename-display {
            color: var(--text-secondary);
            font-size: 0.85rem;
            flex: 1;
            min-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .filename-display strong {
            color: var(--text-primary);
        }

        /* ==================== 播放器控制区 ==================== */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .play-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .play-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .play-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ==================== 进度条 + 节点标记 ==================== */
        .progress-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-container {
            position: relative;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .progress-track {
            position: relative;
            width: 100%;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 4px;
            overflow: visible;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-handle {
            position: absolute;
            top: 50%;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            left: 0%;
            transition: left 0.1s linear, transform 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            z-index: 5;
            opacity: 0;
        }

        .progress-container:hover .progress-handle {
            opacity: 1;
        }

        .progress-handle.dragging {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* 节点标记（竖线 + 圆点） */
        .node-marker {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 20px;
            background: var(--node-color);
            border-radius: 2px;
            z-index: 3;
            cursor: pointer;
            transition: var(--transition);
        }

        .node-marker::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: var(--node-color);
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            transition: var(--transition);
        }

        .node-marker:hover {
            height: 26px;
            background: var(--accent-hover);
        }

        .node-marker:hover::after {
            background: var(--accent-hover);
            transform: translateX(-50%) scale(1.3);
        }

        .node-marker.active {
            background: var(--node-active);
        }

        .node-marker.active::after {
            background: var(--node-active);
            box-shadow: 0 0 10px var(--node-active);
        }

        /* 节点 tooltip */
        .node-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            white-space: nowrap;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .node-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #000;
        }

        .node-marker:hover .node-tooltip {
            opacity: 1;
        }

        /* 时间显示 */
        .time-display {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            min-width: 95px;
            text-align: right;
        }

        .time-display #current-time {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ==================== 音量与倍速 ==================== */
        .secondary-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-control input[type="range"] {
            width: 80px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .speed-control select {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ==================== 添加节点区 ==================== */
        .add-node-section {
            display: flex;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .node-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .node-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
        }

        .node-input::placeholder {
            color: var(--text-muted);
        }

        .add-node-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
        }

        .add-node-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .add-node-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ==================== 节点列表 ==================== */
        .node-list-section h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .node-count-badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .node-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .node-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .node-item:hover {
            border-color: var(--border);
            background: var(--bg-hover);
        }

        .node-item.active {
            border-color: var(--node-active);
            background: rgba(45, 212, 191, 0.08);
        }

        .node-index {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
        }

        .node-item.active .node-index {
            color: var(--node-active);
            background: rgba(45, 212, 191, 0.15);
        }

        .node-time {
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
            min-width: 55px;
        }

        .node-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .node-action-btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            font-weight: 500;
        }

        .jump-btn {
            background: rgba(45, 212, 191, 0.15);
            color: var(--node-active);
        }

        .jump-btn:hover {
            background: rgba(45, 212, 191, 0.3);
        }

        .delete-btn {
            background: rgba(233, 69, 96, 0.15);
            color: var(--accent);
        }

        .delete-btn:hover {
            background: rgba(233, 69, 96, 0.3);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* ==================== 广告位 ==================== */
        .ad-unit {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            position: sticky;
            top: 20px;
        }

        .ad-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 12px;
        }

        .ad-placeholder {
            width: 100%;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* ==================== 响应式适配 ==================== */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
                padding: 12px;
            }

            .ad-sidebar {
                width: 100%;
                order: 2;
            }

            .ad-unit {
                position: static;
            }

            .main-content {
                order: 1;
            }
        }

        @media (max-width: 600px) {
            .app-header h1 {
                font-size: 1.3rem;
            }

            .player-controls {
                flex-wrap: wrap;
            }

            .add-node-section {
                flex-direction: column;
            }

            .node-item {
                flex-wrap: wrap;
            }

            .node-text {
                order: 4;
                width: 100%;
                white-space: normal;
            }

            .card {
                padding: 16px;
            }

            .secondary-controls {
                flex-wrap: wrap;
                gap: 12px;
            }
        }

        /* ==================== 提示消息 ==================== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ==================== 主内容区 ==================== -->
        <main class="main-content">

            <!-- 页面头部 -->
            <header class="app-header">
                <h1>音频节点标注播放器</h1>
                <p>上传音频，在关键时间点添加标注，轻松管理你的音频笔记</p>
            </header>

            <!-- 文件选择卡片 -->
            <div class="card">
                <div class="file-section">
                    <label for="file-input" class="file-btn">选择音频文件</label>
                    <input type="file" id="file-input" accept="audio/*" hidden>
                    <button id="load-sample-btn" class="sample-btn">加载示例音频</button>
                    <span class="filename-display">当前文件: <strong id="filename-text">未加载</strong></span>
                </div>
            </div>

            <!-- 播放器卡片 -->
            <div class="card">
                <!-- 隐藏的原生 audio 元素 -->
                <audio id="audio-player" preload="metadata"></audio>

                <!-- 播放控制 -->
                <div class="player-controls">
                    <button id="play-pause-btn" class="play-btn" disabled>&#9654;</button>

                    <div class="progress-wrapper">
                        <div class="progress-container" id="progress-container">
                            <div class="progress-track" id="progress-track">
                                <div class="progress-fill" id="progress-fill"></div>
                                <div class="progress-handle" id="progress-handle"></div>
                                <!-- 节点标记由 JS 动态插入 -->
                            </div>
                        </div>
                    </div>

                    <div class="time-display">
                        <span id="current-time">00:00</span> / <span id="total-time">00:00</span>
                    </div>
                </div>

                <!-- 音量与倍速 -->
                <div class="secondary-controls">
                    <div class="volume-control">
                        <span class="control-label">音量</span>
                        <input type="range" id="volume-slider" min="0" max="100" value="100">
                    </div>
                    <div class="speed-control">
                        <span class="control-label">倍速</span>
                        <select id="speed-select">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                        </select>
                    </div>
                </div>

                <!-- 添加节点 -->
                <div class="add-node-section">
                    <input type="text" id="node-text-input" class="node-input"
                           placeholder="输入节点注释（如：重点内容、精彩片段...）" disabled>
                    <button id="add-node-btn" class="add-node-btn" disabled>添加节点</button>
                </div>
            </div>

            <!-- 节点列表卡片 -->
            <div class="card node-list-section">
                <h2>
                    节点列表
                    <span class="node-count-badge" id="node-count">0</span>
                </h2>
                <div class="node-list" id="node-list">
                    <!-- 节点列表由 JS 动态生成 -->
                </div>
            </div>

        </main>

        <!-- ==================== 广告侧边栏 ==================== -->
        <aside class="ad-sidebar">
            <div class="ad-unit">
                <div class="ad-label">广告 · Advertisement</div>

                <!-- ============================================== -->
                <!-- Google AdSense 展示广告单元                     -->
                <!-- 请将 ca-pub-xxxxx 替换为你的发布者 ID           -->
                <!-- data-ad-slot 替换为你的广告单元 ID              -->
                <!-- ============================================== -->
                <ins class="adsbygoogle"
                     style="display:block; width:100%; min-height:250px;"
                     data-ad-client="ca-pub-xxxxx"
                     data-ad-slot="1234567890"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>

                <!-- 广告加载脚本（仅需执行一次，多个广告单元共用） -->
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </aside>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  音频节点标注播放器 — 核心逻辑
        // ============================================================

        // ---- DOM 引用 ----
        const audioPlayer     = document.getElementById('audio-player');
        const fileInput       = document.getElementById('file-input');
        const loadSampleBtn   = document.getElementById('load-sample-btn');
        const filenameText    = document.getElementById('filename-text');
        const playPauseBtn    = document.getElementById('play-pause-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressTrack   = document.getElementById('progress-track');
        const progressFill    = document.getElementById('progress-fill');
        const progressHandle  = document.getElementById('progress-handle');
        const currentTimeEl   = document.getElementById('current-time');
        const totalTimeEl     = document.getElementById('total-time');
        const volumeSlider    = document.getElementById('volume-slider');
        const speedSelect     = document.getElementById('speed-select');
        const nodeTextInput   = document.getElementById('node-text-input');
        const addNodeBtn      = document.getElementById('add-node-btn');
        const nodeListEl      = document.getElementById('node-list');
        const nodeCountEl     = document.getElementById('node-count');
        const toastEl         = document.getElementById('toast');

        // ---- 状态管理 ----
        let currentFilename = '';       // 当前音频文件名
        let nodes = [];                 // 当前音频的节点数组
        let activeNodeId = null;        // 当前高亮的节点 ID
        let isDragging = false;         // 是否正在拖拽进度条
        const SAMPLE_AUDIO_URL = 'https://www.w3schools.com/html/horse.mp3';
        const SAMPLE_AUDIO_NAME = 'horse.mp3 (示例)';

        // ============================================================
        //  工具函数
        // ============================================================

        /** 将秒数格式化为 MM:SS */
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        /** 生成唯一 ID */
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        /** 显示提示消息 */
        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2200);
        }

        /** 获取当前音频的 localStorage key */
        function getStorageKey() {
            return `audio_nodes_${currentFilename}`;
        }

        // ============================================================
        //  localStorage 持久化
        // ============================================================

        /** 保存节点到 localStorage */
        function saveNodes() {
            if (!currentFilename) return;
            localStorage.setItem(getStorageKey(), JSON.stringify(nodes));
        }

        /** 从 localStorage 加载节点 */
        function loadNodesFromStorage() {
            if (!currentFilename) return;
            const data = localStorage.getItem(getStorageKey());
            nodes = data ? JSON.parse(data) : [];
        }

        // ============================================================
        //  音频文件加载
        // ============================================================

        /**
         * 加载本地音频文件
         * 使用 URL.createObjectURL 创建临时 URL（比 FileReader 更高效，适合媒体文件）
         */
        function loadLocalFile(file) {
            // 兼容校验：部分音频文件（如某些 WAV/M4A）的 file.type 可能为空或不以 audio/ 开头
            // 因此同时校验 MIME type 和文件扩展名
            const audioExts = /\.(mp3|wav|ogg|m4a|aac|flac|wma|opus|webm|mp4)$/i;
            const isAudioMime = file.type.startsWith('audio/') || file.type.startsWith('video/');
            const isAudioExt = audioExts.test(file.name);

            if (!isAudioMime && !isAudioExt) {
                showToast('请选择音频文件（MP3、WAV、OGG、M4A 等）');
                return;
            }

            // 释放上一次的 ObjectURL（防止内存泄漏）
            if (audioPlayer.src && audioPlayer.src.startsWith('blob:')) {
                URL.revokeObjectURL(audioPlayer.src);
            }

            // 使用 URL.createObjectURL 加载本地文件
            const url = URL.createObjectURL(file);
            loadAudio(url, file.name);
        }

        /** 加载示例音频 */
        function loadSampleAudio() {
            loadAudio(SAMPLE_AUDIO_URL, SAMPLE_AUDIO_NAME);
        }

        /**
         * 核心加载函数：设置音频源、更新文件名、重置状态、加载对应节点
         */
        function loadAudio(url, filename) {
            audioPlayer.src = url;
            currentFilename = filename;
            filenameText.textContent = filename;

            // 重置播放器状态
            audioPlayer.currentTime = 0;
            progressFill.style.width = '0%';
            progressHandle.style.left = '0%';
            currentTimeEl.textContent = '00:00';
            playPauseBtn.innerHTML = '&#9654;';

            // 加载新文件时清空节点（时间戳与新文件不匹配）
            loadNodesFromStorage();
            renderNodeMarkers();
            renderNodeList();
            updateActiveNode();

            // 启用控件
            playPauseBtn.disabled = false;
            nodeTextInput.disabled = false;
            addNodeBtn.disabled = false;

            showToast(`已加载: ${filename}`);
        }

        // ============================================================
        //  播放控制
        // ============================================================

        /** 切换播放/暂停 */
        function togglePlayPause() {
            if (!audioPlayer.src) return;
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        /** 进度条点击/拖拽跳转 */
        function seekToPosition(clientX) {
            const rect = progressTrack.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            if (audioPlayer.duration) {
                audioPlayer.currentTime = percent * audioPlayer.duration;
                updateProgressUI(percent);
            }
        }

        /** 更新进度条 UI（填充宽度 + 手柄位置） */
        function updateProgressUI(percent) {
            progressFill.style.width = `${percent * 100}%`;
            progressHandle.style.left = `${percent * 100}%`;
        }

        // ============================================================
        //  节点管理
        // ============================================================

        /** 添加节点（记录当前播放时间 + 用户输入的注释） */
        function addNode() {
            if (!audioPlayer.src || !audioPlayer.duration) {
                showToast('请先加载音频');
                return;
            }

            const time = audioPlayer.currentTime;
            const text = nodeTextInput.value.trim() || '（无注释）';

            const node = {
                id: generateId(),
                time: time,
                timeFormatted: formatTime(time),
                text: text
            };

            // 按时间排序插入，保持节点顺序与时间一致
            nodes.push(node);
            nodes.sort((a, b) => a.time - b.time);

            saveNodes();
            renderNodeMarkers();
            renderNodeList();
            updateActiveNode();

            // 清空输入框
            nodeTextInput.value = '';
            showToast(`节点已添加: ${node.timeFormatted}`);
        }

        /** 删除节点 */
        function deleteNode(nodeId) {
            nodes = nodes.filter(n => n.id !== nodeId);
            if (activeNodeId === nodeId) activeNodeId = null;
            saveNodes();
            renderNodeMarkers();
            renderNodeList();
            updateActiveNode();
            showToast('节点已删除');
        }

        /** 跳转到指定节点时间并自动播放 */
        function jumpToNode(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return;
            audioPlayer.currentTime = node.time;
            audioPlayer.play();
            showToast(`跳转到 ${node.timeFormatted}`);
        }

        // ============================================================
        //  渲染：进度条上的节点标记
        // ============================================================

        function renderNodeMarkers() {
            // 清除旧标记
            progressTrack.querySelectorAll('.node-marker').forEach(el => el.remove());

            if (!audioPlayer.duration) return;

            nodes.forEach(node => {
                const percent = (node.time / audioPlayer.duration) * 100;
                const marker = document.createElement('div');
                marker.className = 'node-marker';
                marker.style.left = `${percent}%`;
                marker.dataset.nodeId = node.id;

                // tooltip 预览
                const tooltip = document.createElement('div');
                tooltip.className = 'node-tooltip';
                tooltip.textContent = `${node.timeFormatted} — ${node.text}`;
                marker.appendChild(tooltip);

                // 点击标记跳转
                marker.addEventListener('click', (e) => {
                    e.stopPropagation();
                    jumpToNode(node.id);
                });

                progressTrack.appendChild(marker);
            });
        }

        // ============================================================
        //  渲染：节点列表
        // ============================================================

        function renderNodeList() {
            nodeCountEl.textContent = nodes.length;

            if (nodes.length === 0) {
                nodeListEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#128193;</div>
                        <p>暂无节点，请添加</p>
                    </div>
                `;
                return;
            }

            nodeListEl.innerHTML = nodes.map((node, index) => `
                <div class="node-item ${node.id === activeNodeId ? 'active' : ''}" data-node-id="${node.id}">
                    <div class="node-index">#${index + 1}</div>
                    <div class="node-time">${node.timeFormatted}</div>
                    <div class="node-text">${escapeHtml(node.text)}</div>
                    <div class="node-actions">
                        <button class="node-action-btn jump-btn" onclick="jumpToNode('${node.id}')">跳转</button>
                        <button class="node-action-btn delete-btn" onclick="deleteNode('${node.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        /** HTML 转义防止 XSS */
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        //  当前节点高亮
        // ============================================================

        function updateActiveNode() {
            if (!audioPlayer.duration || nodes.length === 0) {
                activeNodeId = null;
                updateActiveUI();
                return;
            }

            // 找到当前时间之前最近的节点（即正在播放到的节点）
            let newActiveId = null;
            for (let i = nodes.length - 1; i >= 0; i--) {
                if (audioPlayer.currentTime >= nodes[i].time) {
                    newActiveId = nodes[i].id;
                    break;
                }
            }

            if (newActiveId !== activeNodeId) {
                activeNodeId = newActiveId;
                updateActiveUI();
            }
        }

        /** 更新高亮 UI（标记 + 列表项） */
        function updateActiveUI() {
            // 更新标记
            document.querySelectorAll('.node-marker').forEach(el => {
                el.classList.toggle('active', el.dataset.nodeId === activeNodeId);
            });
            // 更新列表项
            document.querySelectorAll('.node-item').forEach(el => {
                el.classList.toggle('active', el.dataset.nodeId === activeNodeId);
            });
        }

        // ============================================================
        //  事件监听
        // ============================================================

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadLocalFile(e.target.files[0]);
                // 重置 input 以便重复选择同一文件
                e.target.value = '';
            }
        });

        // 加载示例
        loadSampleBtn.addEventListener('click', loadSampleAudio);

        // 播放/暂停
        playPauseBtn.addEventListener('click', togglePlayPause);

        // 音频元数据加载完成
        audioPlayer.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audioPlayer.duration);
            renderNodeMarkers(); // 时长确定后重新渲染标记位置
        });

        // 音频播放中 — 更新进度条和时间
        audioPlayer.addEventListener('timeupdate', () => {
            if (!isDragging && audioPlayer.duration) {
                const percent = audioPlayer.currentTime / audioPlayer.duration;
                updateProgressUI(percent);
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
            updateActiveNode();
        });

        // 播放状态变化
        audioPlayer.addEventListener('play', () => {
            playPauseBtn.innerHTML = '&#10074;&#10074;';
        });

        audioPlayer.addEventListener('pause', () => {
            playPauseBtn.innerHTML = '&#9654;';
        });

        // 播放结束
        audioPlayer.addEventListener('ended', () => {
            playPauseBtn.innerHTML = '&#9654;';
            progressFill.style.width = '100%';
            progressHandle.style.left = '100%';
        });

        // 音量控制
        volumeSlider.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value / 100;
        });

        // 倍速控制
        speedSelect.addEventListener('change', (e) => {
            audioPlayer.playbackRate = parseFloat(e.target.value);
        });

        // 添加节点按钮
        addNodeBtn.addEventListener('click', addNode);

        // 输入框回车添加
        nodeTextInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addNode();
        });

        // ---- 进度条交互（点击 + 拖拽） ----
        progressContainer.addEventListener('mousedown', (e) => {
            if (!audioPlayer.duration) return;
            isDragging = true;
            progressHandle.classList.add('dragging');
            seekToPosition(e.clientX);
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            seekToPosition(e.clientX);
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                progressHandle.classList.remove('dragging');
            }
        });

        // 触摸事件（移动端支持）
        progressContainer.addEventListener('touchstart', (e) => {
            if (!audioPlayer.duration) return;
            isDragging = true;
            seekToPosition(e.touches[0].clientX);
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            seekToPosition(e.touches[0].clientX);
        }, { passive: true });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        // ============================================================
        //  初始化：默认加载示例音频
        // ============================================================
        loadSampleAudio();
    </script>
</body>
</html>
